name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (domain, content format)
        run: ./gradlew :core:domain:test :core:content:test --stacktrace

      - name: Validate sample course packs
        run: |
          ./gradlew :tools:packer:installDist
          for dir in sample-content/*/; do
            tools/packer/build/install/packer/bin/packer "$dir" "build/packs/$(basename "$dir").zip"
          done

      - name: Build APKs
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: kidlearn-apks
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
